<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد Hungerstation الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen">

    <!-- واجهة الشات -->
    <main class="flex-1 flex flex-col max-w-2xl mx-auto w-full bg-white shadow-lg overflow-hidden">
        <header class="bg-blue-600 p-4 text-white text-center font-bold">مساعد الذكاء الاصطناعي</header>
        <div id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-blue-100 p-3 rounded-lg self-start max-w-[80%] text-gray-800">أهلاً بك! أنا جاهز للمساعدة. كيف يمكنني دعمك اليوم؟</div>
        </div>
        <footer class="p-4 border-t">
            <div class="flex gap-2">
                <input type="text" id="userInput" class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب سؤالك...">
                <button onclick="handleSend()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">إرسال</button>
            </div>
        </footer>
    </main>

    <script>
        function handleSend() {
            const input = document.getElementById('userInput');
            const chatWindow = document.getElementById('chatWindow');
            if (!input.value.trim()) return;
            const msg = document.createElement('div');
            msg.className = "bg-blue-500 text-white p-3 rounded-lg self-end max-w-[80%]";
            msg.textContent = input.value;
            chatWindow.appendChild(msg);
            input.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
